name: Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependencies and authorization tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install host dependencies and scanner
        id: install
        run: python -m pip install -r runtime/host/requirements.txt pip-audit
      - name: Audit host dependencies for known vulnerabilities
        run: python -m pip_audit -r runtime/host/requirements.txt
      - name: Run authorization and security regression tests
        if: ${{ !cancelled() && steps.install.outcome != 'failure' }}
        run: python runtime/host/tests/test_security.py
